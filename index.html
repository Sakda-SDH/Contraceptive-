<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Forgotten Contraception Protocol</title><style>
*{box-sizing:border-box}body{margin:0;background:#101a1b;color:#f4f5ef;font:17px/1.55 system-ui,sans-serif;min-height:100vh;background-size:cover;background-position:center;background-attachment:fixed}header{background:#101a1b;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 5%;border-bottom:1px solid #607774}header button{margin-left:auto}main{max-width:900px;margin:32px auto;padding:clamp(18px,4vw,40px);background:#152526f5;border:1px solid #607774;border-radius:16px;width:94%}h1,h2{line-height:1.2;color:#f4d69c}button,select,input{font:inherit;border-radius:8px;padding:10px 14px;border:1px solid #8fa9a5}button{background:#c7e5d8;color:#102820;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#263d3e;color:white}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #ffd477;outline-offset:3px}select,input{max-width:100%;background:#fff;color:#172626}fieldset{border:1px solid #607774;border-radius:10px;padding:16px;margin:16px 0}legend{font-weight:bold}label.option{display:block;padding:12px;border-bottom:1px solid #435958}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}label.match{display:block;margin:15px 0}label.match select{display:block;width:100%;margin-top:6px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.cards button{text-align:left;min-height:110px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.feedback{padding:16px;border:2px solid #9ad6b7;border-radius:8px;margin-top:16px}.bad{border-color:#ffad99}.muted{color:#c2d2cf}.fragments{display:flex;align-items:center;justify-content:center;gap:0;margin:20px 0}.fragments img{width:50%;object-fit:contain;display:block}.single img{max-width:100%;max-height:350px}progress{width:110px;accent-color:#9ad6b7}summary{cursor:pointer;color:#f4d69c}#notice{font-size:14px;color:#f4d69c} [hidden]{display:none!important} @media(max-width:500px){main{margin:12px auto}header{gap:8px;font-size:14px}header button{margin-left:0}}
</style></head><body><header><strong>Hospital archives</strong><span id="clock" aria-label="Time remaining">20:00</span><span id="life">Life: 100/100</span><span id="progressText">0/6 challenges</span><progress id="progress" max="6" value="0" aria-label="Challenges completed"></progress><button id="audioToggle" class="secondary" aria-pressed="false">Unmute</button></header><main id="main"></main><audio id="music" src="assets/background_music.mp3" loop preload="none"></audio><script>
'use strict';
// Educator configuration: verify these digits against the original fragment images before distribution.
const ACCESS_CODE='2746';
const rooms=[['The Abandoned Family Planning Clinic','Several patient records remain scattered across an abandoned consultation desk. The first document fragment is locked inside a filing cabinet. To retrieve it, students must identify appropriate contraceptive methods for the patients.'],['The Reproductive Physiology Laboratory','An old laboratory contains incomplete research notes describing how different contraceptives influence reproductive physiology. Students must reconstruct the findings to unlock the laboratory safe containing the second document fragment.'],['The Restricted Clinical Consultation Room','The security door opens, revealing the hospital’s final patient records. Students must now demonstrate their ability to integrate reproductive physiology, clinical knowledge and patient preferences before the hospital’s emergency exit can be unlocked.']];
const methods=['Male condom','Levonorgestrel-releasing intrauterine system (LNG-IUS)','Copper IUD','Combined oral contraceptive pill (COCP)'];
const questions=[
[{title:'Patient–contraceptive matching',type:'matching',prompt:'Match each patient with the most appropriate contraceptive method from the available options. Each option should be used once.',rows:['A. A 22-year-old woman with multiple sexual partners who requires protection against sexually transmitted infections.','B. A 30-year-old woman with heavy menstrual bleeding who desires long-term reversible contraception.','C. A 28-year-old woman who desires long-term, hormone-free, reversible contraception and has normal menstrual bleeding.','D. A 26-year-old healthy, non-smoking woman who prefers daily oral contraception and desires more predictable menstrual bleeding.'],choices:[methods[2],methods[0],methods[3],methods[1]],answer:[methods[0],methods[1],methods[2],methods[3]],hint:'Consider STI protection, menstrual blood loss, hormone preferences and route of administration.',feedback:'Male condom: Provides barrier contraception and reduces the risk of sexually transmitted infections. Dual protection with another contraceptive method may be appropriate.\nLNG-IUS: Thickens cervical mucus and suppresses endometrial proliferation, reducing menstrual blood loss.\nCopper IUD: Produces a local inflammatory environment that impairs sperm function and fertilisation without hormonal administration.\nCOCP: Suppresses follicular development and ovulation through negative feedback on the hypothalamic–pituitary–ovarian axis.'},
{title:'Identifying contraindications',type:'multiple',prompt:'Which of the following patients should avoid combined oestrogen-containing hormonal contraception? Select all that apply.',choices:['A 38-year-old woman who smokes 20 cigarettes per day.','A 24-year-old woman with migraine with aura.','A 25-year-old healthy, non-smoking nulliparous woman.','A 32-year-old woman with a previous oestrogen-associated deep vein thrombosis who is not receiving anticoagulation.','A 27-year-old healthy woman with primary dysmenorrhoea.'],answer:['0','1','3'],hint:'Consider arterial and venous thrombotic risk.',feedback:'Oestrogen-containing contraceptives increase thrombotic risk. Smoking above the age of 35, migraine with aura and certain histories of venous thromboembolism represent important contraindications. Nulliparity and primary dysmenorrhoea alone are not contraindications.'}],
[{title:'Reconstructing the physiological pathway',type:'sequence',prompt:'Arrange the following physiological events in the correct sequence to explain how the combined oral contraceptive pill prevents ovulation.',choices:['A. Suppression of FSH and prevention of the mid-cycle LH surge','B. Administration of exogenous oestrogen and progestogen','C. Inhibition of ovulation','D. Negative feedback on the hypothalamic–pituitary axis'],answer:['1','3','0','2'],hint:'Start with hormone administration and follow the feedback pathway.',feedback:'Exogenous ovarian hormones exert negative feedback on the hypothalamic–pituitary axis. Suppression of FSH limits follicular development, while prevention of the mid-cycle LH surge inhibits ovulation. Progestogens also increase cervical mucus viscosity.'},
{title:'Contraception during lactation',type:'dropdown',prompt:'A 29-year-old woman is four weeks postpartum, exclusively breastfeeding and amenorrhoeic. She wishes to use an oral contraceptive without oestrogen. Complete the following statements by selecting the appropriate options.',rows:['Breastfeeding stimulates the release of','which contributes to the suppression of pulsatile','secretion. An appropriate oral contraceptive for this patient is the','which provides contraception partly by'],choices:[['Oestrogen','Prolactin','Oxytocin','Progesterone'],['GnRH','TSH','ACTH','GH'],['Combined oral contraceptive pill','Progestogen-only pill','Emergency contraceptive pill'],['Decreasing','Increasing']],answer:['Prolactin','GnRH','Progestogen-only pill','Increasing'],hint:'Think about the lactation-associated endocrine changes and an oestrogen-free oral method.',feedback:'Suckling-induced neuroendocrine changes, including elevated prolactin, suppress pulsatile GnRH secretion and reduce ovarian activity. Progestogen-only pills are generally suitable during breastfeeding and act by thickening cervical mucus, with variable suppression of ovulation depending on the formulation.\nLactational amenorrhoea itself provides effective contraception only when specific criteria are fulfilled.'}],
[{title:'Complex clinical decision-making',type:'single',prompt:'A 36-year-old woman presents to the family planning clinic requesting contraception. She is G2P2, smokes 20 cigarettes per day, has migraine with aura and heavy menstrual bleeding, desires reversible contraception for at least three years and does not wish to take daily medication. Which of the following is the most appropriate contraceptive method for this patient?',choices:['Combined oral contraceptive pill','Copper intrauterine device','Levonorgestrel-releasing intrauterine system','Progestogen-only pill','Combined hormonal contraceptive patch'],answer:['2'],hint:'Consider bleeding, oestrogen contraindications and the need for long-acting contraception.',feedback:'The LNG-IUS provides long-acting reversible contraception without oestrogen exposure. Its local progestogenic effects suppress endometrial proliferation and reduce menstrual blood loss.\nCombined hormonal methods are contraindicated given her migraine with aura and smoking history. Although the copper IUD provides effective long-term contraception, it may exacerbate heavy menstrual bleeding. The progestogen-only pill requires daily administration.'},
{title:'The emergency contraception challenge',type:'single',prompt:'A 21-year-old woman presents 96 hours after unprotected sexual intercourse. She wishes to prevent pregnancy and would also like to initiate long-term, hormone-free contraception. She has no contraindications to intrauterine contraception and is willing to undergo insertion. Which is the most appropriate contraceptive option?',choices:['Levonorgestrel emergency contraceptive pill','Ulipristal acetate emergency contraceptive pill','Copper intrauterine device','Combined oral contraceptive pill started using the routine daily regimen','Depot medroxyprogesterone acetate injection'],answer:['2'],hint:'Consider both the emergency contraception window and long-term hormone-free protection.',feedback:'The copper IUD is the most effective established method of emergency contraception and can generally be inserted within five days of unprotected intercourse. Copper impairs sperm viability and function, thereby preventing fertilisation.\nIt also provides ongoing, hormone-free, reversible contraception, fulfilling both of the patient’s requirements.\nUlipristal acetate is a suitable oral emergency contraceptive within 120 hours but does not itself provide ongoing contraception.'}]];
const main=document.getElementById('main'),music=document.getElementById('music');let muted=true,state;const effects={};for(const name of ['correct','incorrect','document_found','door_unlock'])effects[name]=new Audio('assets/'+name+'.mp3');
function sound(name){if(!muted){effects[name].currentTime=0;effects[name].play().catch(()=>{});}}
document.getElementById('audioToggle').onclick=()=>{muted=!muted;const b=document.getElementById('audioToggle');b.textContent=muted?'Unmute':'Mute';b.setAttribute('aria-pressed',String(!muted));if(muted){music.pause();Object.values(effects).forEach(a=>a.pause());}else music.play().catch(()=>{b.textContent='Mute (audio unavailable)';});};
function reset(){state={life:100,remaining:1200,deadline:null,done:[0,0,0],unlocked:false,screen:'start',wrong:0};Object.values(effects).forEach(a=>{a.pause();a.currentTime=0});renderStart();update();}
function update(){if(state.deadline!==null){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));}document.getElementById('clock').textContent=String(Math.floor(state.remaining/60)).padStart(2,'0')+':'+String(state.remaining%60).padStart(2,'0');document.getElementById('life').textContent='Life: '+state.life+'/100';const n=state.done.reduce((a,b)=>a+b,0);document.getElementById('progressText').textContent=n+'/6 challenges';document.getElementById('progress').value=n;if(state.deadline!==null&&(state.remaining===0||state.life===0))gameOver();}
function screen(name,html,bg=''){state.screen=name;document.body.style.backgroundImage=bg?`linear-gradient(#101a1b88,#101a1bcc),url('assets/${bg}')`:'';main.innerHTML=html;const h=main.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus();}}
function button(id,fn){document.getElementById(id).onclick=fn;}
function renderStart(){screen('start','<p class="muted">REPRODUCTIVE PHYSIOLOGY · YEAR 2 MBBS</p><h1>The Forgotten Contraception Protocol</h1><p>You enter an abandoned hospital that once housed a renowned reproductive medicine unit. Before the hospital was mysteriously evacuated, its medical team developed a comprehensive contraceptive selection protocol.</p><p>The protocol was torn into two fragments and hidden in separate rooms. The final copy remains secured inside the hospital’s restricted clinical consultation room.</p><p>Demonstrate your understanding of contraception, recover the two missing fragments, unlock the final room and complete the last clinical challenge.</p><button id="start">Start</button>','cover.png');button('start',instructions);}
function instructions(){screen('instructions','<h1>Mission instructions</h1><p>Apply reproductive physiology to select appropriate contraceptives for different patients.</p><ul><li>Explore Rooms 1 and 2 in either order. Answer both questions correctly in each room to collect its document fragment.</li><li>Combine both fragments and enter the four-digit code to unlock Room 3.</li><li>Complete both final questions to escape.</li><li>You have 20 minutes starting when you select Continue, and 100 life points. Each incorrect educational answer costs 10 points. Hints are free; incorrect door codes do not cost points.</li><li>If time or life points reach zero, restart the mission. Audio is optional.</li></ul><button id="continue">Continue</button>');button('continue',()=>{state.deadline=Date.now()+1200000;map();update();});}
function collected(){return state.done[0]===2&&state.done[1]===2;}
function map(){screen('map','<h1>Hospital navigation map</h1><p>Choose an available room.</p><div class="cards">'+rooms.map((r,i)=>`<button id="room${i}" ${i===2&&!state.unlocked?'disabled':''}>Room ${i+1}<br>${r[0]}<br>${state.done[i]===2?'Completed':i===2&&!state.unlocked?'Locked':state.done[i]+'/2 solved · Available'}</button>`).join('')+'</div><h2>Document inventory</h2><p>Fragment A: '+(state.done[0]===2?'Collected':'Not collected')+' · Fragment B: '+(state.done[1]===2?'Collected':'Not collected')+'</p><div class="fragments">'+[0,1].filter(i=>state.done[i]===2).map(i=>fragment(i)).join('')+'</div>'+(collected()&&!state.unlocked?'<button id="reconstruct">Reconstruct document and unlock Room 3</button>':state.unlocked?'<p>Room 3 is unlocked.</p>':'<p>Collect both fragments to reconstruct the clue.</p>'));rooms.forEach((r,i)=>button('room'+i,()=>openRoom(i)));if(collected()&&!state.unlocked)button('reconstruct',reconstruct);}
function fragment(i){return `<img src="assets/fragment${i+1}.png" alt="Collected document fragment ${i===0?'A':'B'}" onerror="this.alt='Fragment ${i===0?'A':'B'} image unavailable'">`;}
function reconstruct(){if(!collected())return;screen('reconstruct','<h1>Reconstruct the document</h1><p>Join Fragment A on the left and Fragment B on the right.</p><div class="fragments">'+fragment(0)+fragment(1)+'</div><details><summary>Accessible text equivalent of reconstructed clue</summary><p>Access code: '+ACCESS_CODE.split('').join(' ')+'</p></details><form id="codeForm"><label for="code">Four-digit access code</label><br><input id="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off"><button>Unlock Room 3</button></form><p id="codeFeedback" role="status"></p><button id="back" class="secondary">Back to Map</button>');button('back',map);document.getElementById('codeForm').onsubmit=e=>{e.preventDefault();if(!collected()||state.screen!=='reconstruct')return;if(document.getElementById('code').value===ACCESS_CODE){state.unlocked=true;sound('door_unlock');map();}else{sound('incorrect');document.getElementById('codeFeedback').textContent='Incorrect code. Review the reconstructed document and try again.';}};}
function selectHtml(options,values,label){return `<select required aria-label="${label}"><option value="">Choose an option</option>${options.map((v,i)=>`<option value="${values?values[i]:v}">${v}</option>`).join('')}</select>`;}
function controls(q){if(q.type==='single'||q.type==='multiple')return q.choices.map((v,i)=>`<label class="option"><input type="${q.type==='single'?'radio':'checkbox'}" name="choice" value="${i}" ${q.type==='single'?'required':''}>${String.fromCharCode(65+i)}. ${v}</label>`).join('');if(q.type==='matching')return q.rows.map((r,i)=>`<label class="match">${r}${selectHtml(q.choices,null,'Patient '+(i+1))}</label>`).join('');if(q.type==='sequence')return q.choices.map((_,i)=>`<label class="match">Position ${i+1}${selectHtml(q.choices,['0','1','2','3'],'Position '+(i+1))}</label>`).join('');return q.rows.map((r,i)=>`<label class="match">${r}${selectHtml(q.choices[i],null,'Blank '+(i+1))}</label>`).join('')+'<p>cervical mucus viscosity.</p>';}
function openRoom(i){if(i===2&&!state.unlocked)return;if(state.done[i]===2){reward(i);return;}const n=state.done[i],q=questions[i][n];screen('room','<p class="muted">ROOM '+(i+1)+' · QUESTION '+(n+1)+' OF 2</p><h1>'+rooms[i][0]+'</h1><p>'+rooms[i][1]+'</p><h2>'+q.title+'</h2><p>'+q.prompt+'</p><form id="answer"><fieldset><legend>'+({single:'Select one answer',multiple:'Select all that apply',matching:'Match each patient',sequence:'Choose the event at each position',dropdown:'Complete the statements'}[q.type])+'</legend>'+controls(q)+'</fieldset><button id="submit">Submit answer</button></form><details><summary>Optional hint</summary><p>'+q.hint+'</p></details><div id="feedback" role="status" aria-live="polite"></div><div class="actions"><button id="next" hidden>Continue</button><button id="back" class="secondary">Back to Map</button></div>','room'+(i+1)+'.png');button('back',()=>{if(state.done[2]===2)complete();else if(state.done[i]===2)reward(i);else map();});const form=document.getElementById('answer');form.onsubmit=e=>{e.preventDefault();if(state.done[i]!==n||state.screen!=='room')return;update();if(state.screen==='over')return;const a=[...form.querySelectorAll('select,input:checked')].map(x=>x.value);const f=document.getElementById('feedback');if(!a.length){f.textContent='Select at least one answer.';return;}if((q.type==='sequence'||q.type==='matching')&&new Set(a).size!==a.length){f.textContent='Use each option exactly once.';return;}const ok=JSON.stringify(a)===JSON.stringify(q.answer);f.className='feedback'+(ok?'':' bad');f.innerHTML='<strong>'+(ok?'Correct!':'Incorrect. −10 life points. Try again.')+'</strong>'+q.feedback.split('\n').map(p=>'<p>'+p+'</p>').join('');sound(ok?'correct':'incorrect');if(ok){state.done[i]++;form.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);const next=document.getElementById('next');next.hidden=false;next.textContent=state.done[i]===2?(i===2?'Finish mission':'Collect document fragment'):'Next question';next.onclick=()=>{if(state.done[i]===2)reward(i);else openRoom(i);};if(state.done[i]===2&&i<2)sound('document_found');if(state.done[2]===2){state.deadline=null;}}else{state.life=Math.max(0,state.life-10);state.wrong++;}update();};}
function reward(i){if(i===2){complete();return;}screen('reward','<h1>Document fragment recovered</h1><p>Fragment '+(i===0?'A — Patient Selection':'B — Physiological Mechanisms')+' collected.</p><div class="single">'+fragment(i)+'</div><p>'+(i===0?'This fragment contains the first two digits.':'This fragment contains the final two digits.')+'</p><button id="back">Back to Map</button>','room'+(i+1)+'.png');button('back',map);}
function complete(){state.deadline=null;screen('complete','<h1>Escape successful!</h1><p>The Forgotten Contraception Protocol has been recovered.</p><h2>Contraception Champion</h2><p>3/3 rooms completed · 6/6 challenges solved · 2/2 fragments recovered.</p><p>Life points remaining: '+state.life+' · Incorrect answers: '+state.wrong+' · Time remaining: '+document.getElementById('clock').textContent+'</p><p>You have successfully demonstrated your ability to apply reproductive physiology and clinical reasoning to contraceptive selection.</p><button id="restart">Restart</button>');button('restart',reset);}
function gameOver(){state.deadline=null;screen('over','<h1>Game Over</h1><p>'+(state.life===0?'You have run out of life points.':'Your time has expired.')+'</p><p>Challenges solved: '+state.done.reduce((a,b)=>a+b,0)+'/6. Restart to try again.</p><button id="restart">Restart</button>');button('restart',reset);}
reset();setInterval(update,250);
</script></body></html>
